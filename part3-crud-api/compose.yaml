# One command to run the whole stack:
#   docker compose up --build        → API on http://localhost:8080, PostgreSQL on localhost:5433
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"   # 5433 so it doesn't clash with the repo-root compose database
    volumes:
      - tasks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks
      STORAGE: postgres
      DB_POOL_SIZE: "8"
      HTTP_THREADS: "8"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tasks-pgdata:
